name: Feature request
description: Suggest a new prop, behavior or skill improvement.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: The page and the situation, not the solution.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would help?
      description: A prop, an export, a change to the skill. A usage sketch is welcome.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Workarounds you tried
