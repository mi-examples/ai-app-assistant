version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # Give the community a week to spot a compromised release before we pick it up.
    cooldown:
      default-days: 7
    groups:
      # The @vitest/* packages require the exact same vitest version.
      vitest:
        patterns: ['vitest', '@vitest/*']
      typescript-eslint:
        patterns: ['@typescript-eslint/*']
      react:
        patterns: ['react', 'react-dom', '@types/react', '@types/react-dom']
    commit-message:
      prefix: chore
      include: scope

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns: ['*']
    commit-message:
      prefix: ci
      include: scope
