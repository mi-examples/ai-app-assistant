version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # Give the community a week to spot a compromised release before we pick it up.
    cooldown:
      default-days: 7
    groups:
      # The @vitest/* packages require the exact same vitest version.
      vitest:
        patterns: ['vitest', '@vitest/*']
      typescript-eslint:
        patterns: ['@typescript-eslint/*']
      react:
        patterns: ['react', 'react-dom', '@types/react', '@types/react-dom']
    ignore:
      # A React major changes the peer range the package supports, so it is a
      # deliberate change with code fixes, not an automatic update.
      - dependency-name: 'react'
        update-types: ['version-update:semver-major']
      - dependency-name: 'react-dom'
        update-types: ['version-update:semver-major']
      - dependency-name: '@types/react'
        update-types: ['version-update:semver-major']
      - dependency-name: '@types/react-dom'
        update-types: ['version-update:semver-major']
    commit-message:
      prefix: chore
      include: scope

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns: ['*']
    commit-message:
      prefix: ci
      include: scope
